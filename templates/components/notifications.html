<div x-data>
  <!-- Toast Notification -->
  <div class="fixed bottom-0 right-0 p-4 z-50 transition-all duration-300" style="z-index: 11">
    <div x-ref="toast" class="hidden bg-space-800 rounded-lg shadow-xl border border-white/10 overflow-hidden transform transition-all duration-300" role="alert" aria-live="assertive" aria-atomic="true" data-bs-autohide="false">
      <div class="bg-gradient-to-r from-accent/20 to-accent-2/20 px-4 py-3 border-b border-accent/20 flex justify-between items-center backdrop-blur-sm">
        <strong class="text-accent" x-text="$store.toast.title"></strong>
        <div class="flex items-center gap-2">
          <small class="text-gray-400">just now</small>
          <button type="button" class="text-gray-400 hover:text-white transition" data-bs-dismiss="toast" aria-label="Close">
            <i class="fas fa-times"></i>
          </button>
        </div>
      </div>
      <div class="px-4 py-3 text-gray-300" x-html="$store.toast.html">
      </div>
    </div>
  </div>
</div>


<div x-data="{
    closeModal() {
      const modal = this.$refs.modal;
      if (modal && modal._modalInstance) {
        modal._modalInstance.hide();
      }
    }
  }">
  <!-- Modal -->
  <div class="hidden fixed inset-0 bg-space-900/80 backdrop-blur-sm z-50 flex items-center justify-center p-4" x-ref="modal" tabindex="-1" @click="closeModal()">
    <div class="modal-dialog bg-space-800 rounded-xl shadow-2xl max-w-md w-full overflow-hidden border-t-4 border-t-accent border border-white/10 transform transition-all" @click.stop>
      <!-- Modal Header -->
      <div class="bg-gradient-to-r from-space-700 to-space-800 px-6 py-4 border-b border-white/10 flex justify-between items-center">
        <h5 class="text-lg font-bold text-white flex items-center gap-2" x-text="$store.modal.title"></h5>
        <button type="button" class="text-gray-400 hover:text-accent transition duration-200" @click="closeModal()" aria-label="Close">
          <i class="fas fa-times text-xl"></i>
        </button>
      </div>
      
      <!-- Modal Body -->
      <div class="px-6 py-4 bg-space-800">
        <p class="text-gray-300 leading-relaxed" x-html="$store.modal.html"></p>
      </div>
      
      <!-- Modal Footer -->
      <div class="bg-space-900/50 px-6 py-3 border-t border-white/10 flex justify-end">
        <button type="button" class="px-5 py-2 bg-gradient-to-r from-accent to-accent-2 hover:brightness-110 text-space-900 rounded-lg font-bold transition-all shadow-md hover:shadow-lg transform hover:-translate-y-0.5" @click="closeModal()">Got it!</button>
      </div>
    </div>
  </div>
</div>

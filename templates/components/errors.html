<div>
  {% for info in infos %}
    <div class="alert bg-blue-900/50 border border-blue-500/50 text-blue-300 px-4 py-3 rounded-lg mb-4 flex justify-between items-center" role="alert">
      <span>{{ info }}</span>
      <button type="button" class="text-blue-300 hover:text-white font-bold text-lg" data-bs-dismiss="alert" aria-label="Close">
        &times;
      </button>
    </div>
  {% endfor %}

  {% for error in errors %}
    <div class="alert bg-red-900/50 border border-red-500/50 text-red-100 px-4 py-3 rounded-lg mb-4 flex justify-between items-center" role="alert">
      <span>{{ error }}</span>
      <button type="button" class="text-red-300 hover:text-white font-bold text-lg" data-bs-dismiss="alert" aria-label="Close">
        &times;
      </button>
    </div>
  {% endfor %}
</div>
